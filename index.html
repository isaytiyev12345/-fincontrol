<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>FinControl v1.0</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial;background:#f3f4f6;color:#111827}header{padding:20px 18px 12px;background:#111827;color:#fff;position:sticky;top:0;z-index:5}h1{margin:0 0 4px;font-size:25px}.period{font-size:12px;color:#cbd5e1}main{max-width:760px;margin:auto;padding:14px 14px 92px}.card{background:#fff;border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 2px 12px #0001}.title{font-size:18px;font-weight:750;margin-bottom:9px}.muted{font-size:12px;color:#64748b}.big{font-size:30px;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#f8fafc;border-radius:15px;padding:13px}.metric b{display:block;font-size:20px;margin-top:4px}.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:12px;padding:11px 13px;background:#111827;color:#fff;font-weight:650}button.secondary{background:#e5e7eb;color:#111827}button.danger{background:#fee2e2;color:#991b1b}button.small{padding:7px 9px;font-size:12px}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e7eb;display:flex;justify-content:space-around;padding:7px 3px calc(7px + env(safe-area-inset-bottom));z-index:10}nav button{background:transparent;color:#64748b;font-size:10px;padding:5px}.active{color:#111827!important}input,select,textarea{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:11px;background:#fff;font-size:16px}textarea{min-height:70px}label{font-size:12px;color:#475569;display:block;margin:10px 0 5px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #eef2f7}.row:last-child{border-bottom:0}.row-main{min-width:0}.row-main b{display:block}.row-main span{font-size:12px;color:#64748b}.bar{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:#111827}.empty{text-align:center;padding:22px;color:#64748b}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;z-index:30}.sheet{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px}.hidden{display:none!important}.notice{background:#f8fafc;border-radius:12px;padding:11px;font-size:12px;color:#475569}</style></head><body><header><h1>FinControl</h1><div class="period" id="period"></div></header><main id="app"></main><nav><button id="n-home" onclick="show('home')">🏠<br>Главная</button><button id="n-expenses" onclick="show('expenses')">📋<br>Расходы</button><button id="n-analysis" onclick="show('analysis')">📊<br>Аналитика</button><button id="n-finance" onclick="financeLock()">🔐<br>Финансы</button><button id="n-more" onclick="show('more')">⚙️<br>Ещё</button></nav><div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div><script>
const KEY='fincontrol_v1_0';let db=JSON.parse(localStorage.getItem(KEY)||'null')||{expenses:[],incomes:[],debts:[],charity:[],savings:[],cushion:0,accounts:[{name:'Наличные',balance:0},{name:'Основная карта',balance:0},{name:'Другая карта',balance:0},{name:'Накопительный счёт',balance:0}],categories:['Продукты','Автомобиль','Дом','Лечение','Одежда','Развлечения','Кафе/рестораны','Услуги','Транспорт','Связь/интернет','Покупки','Обучение','Другое'],pin:'1234'};function save(){localStorage.setItem(KEY,JSON.stringify(db))}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}function money(n){return new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:0}).format(Number(n)||0)}function fmt(s){let d=new Date(s);return isNaN(d)?'—':d.toLocaleDateString('ru-RU')}function period(){let d=new Date(),m=d.getMonth(),y=d.getFullYear();if(d.getDate()<15)m--;return{start:new Date(y,m,15),end:new Date(y,m+1,14,23,59,59)}}function inPeriod(s){let d=new Date(s),p=period();return d>=p.start&&d<=p.end}function label(){let p=period();return fmt(p.start)+' → '+fmt(p.end)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function total(a){return a.reduce((s,x)=>s+Number(x.amount||0),0)}function nav(id){document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));document.getElementById('n-'+id)?.classList.add('active')}function show(id){nav(id);document.getElementById('period').textContent='Финансовый период: '+label();let a=document.getElementById('app');a.innerHTML=id==='home'?home():id==='expenses'?expenses():id==='analysis'?analysis():more()}function home(){let e=db.expenses.filter(x=>inPeriod(x.date)),i=db.incomes.filter(x=>inPeriod(x.date)),c=db.charity.filter(x=>inPeriod(x.date)),s=db.savings.filter(x=>inPeriod(x.date)),d=db.debts.filter(x=>inPeriod(x.date));let E=total(e),I=total(i),C=total(c),S=total(s),D=total(d),left=I-E-C-S-D;return `<div class=card><div class=muted>СВОБОДНЫЙ ОСТАТОК</div><div class=big>${money(left)}</div><div class=actions style="margin-top:12px"><button onclick="expenseForm()">➕ Расход</button><button onclick="incomeForm()">➕ Доход</button><button onclick="debtForm()">➕ Долг</button><button onclick="savingForm()">➕ Сбережение</button></div></div><div class=grid><div class=metric>Доходы<b>${money(I)}</b></div><div class=metric>Расходы<b>${money(E)}</b></div><div class=metric>Сбережения<b>${money(S)}</b></div><div class=metric>Благотворительность<b>${money(C)}</b></div></div><div class=card><div class=title>Расходы по категориям</div>${db.categories.map(c=>{let v=total(e.filter(x=>x.cat===c));return v?`<div class=row><span>${esc(c)}</span><b>${money(v)}</b></div>`:''}).join('')||'<div class=empty>Пока нет расходов.</div>'}</div><div class=card><div class=title>🤝 Мне должны</div><div class=big>${money(db.debts.reduce((s,x)=>s+Math.max(0,Number(x.amount)-Number(x.returned||0)),0))}</div><div class=muted>Невозвращённая сумма</div></div>`}function expenses(){let a=[...db.expenses].sort((x,y)=>y.date.localeCompare(x.date));return `<div class=card><div class=actions><button onclick="expenseForm()">➕ Добавить расход</button><button class=secondary onclick="backup()">💾 Резервная копия</button><button class=secondary onclick="restore()">↩️ Восстановить</button></div></div><div class=card><div class=muted>За текущий период: ${money(total(a.filter(x=>inPeriod(x.date))))}</div>${a.map(x=>`<div class=row><div class=row-main><b>${money(x.amount)} · ${esc(x.cat)}</b><span>${fmt(x.date)} · ${esc(x.place||'')} · ${esc(x.what||'')}</span></div><div class=actions><button class=small onclick="expenseForm('${x.id}')">Изм.</button><button class="small danger" onclick="del('expenses','${x.id}')">×</button></div></div>`).join('')||'<div class=empty>Нет записей.</div>'}</div>`}function analysis(){let e=db.expenses.filter(x=>inPeriod(x.date)),I=total(db.incomes.filter(x=>inPeriod(x.date))),E=total(e),S=total(db.savings.filter(x=>inPeriod(x.date))),C=total(db.charity.filter(x=>inPeriod(x.date)));let cats=db.categories.map(c=>({c,v:total(e.filter(x=>x.cat===c))})).filter(x=>x.v).sort((a,b)=>b.v-a.v);return `<div class=card><div class=title>Итоги периода</div><div class=grid><div class=metric>Доход<b>${money(I)}</b></div><div class=metric>Расход<b>${money(E)}</b></div><div class=metric>Сбережения<b>${money(S)}</b></div><div class=metric>Благотворительность<b>${money(C)}</b></div></div></div><div class=card><div class=title>Категории расходов</div>${cats.map(x=>`<div class=row><div style="flex:1"><b>${esc(x.c)}</b><div class=bar><i style="width:${E?Math.round(x.v/E*100):0}%"></i></div></div><b>${money(x.v)}</b></div>`).join('')||'<div class=empty>Нет данных.</div>'}</div>`}function financeLock(){if(prompt('PIN раздела «Финансы»')!==db.pin)return alert('Неверный PIN');nav('finance');document.getElementById('period').textContent='Финансовый период: '+label();document.getElementById('app').innerHTML=finance()}function finance(){let I=total(db.incomes.filter(x=>inPeriod(x.date)));return `<div class=card><div class=title>💰 Доходы</div><div class=big>${money(I)}</div><button onclick="incomeForm()">➕ Добавить</button>${db.incomes.map(x=>`<div class=row><div><b>${money(x.amount)} · ${esc(x.source)}</b><span>${fmt(x.date)}</span></div><button class="small danger" onclick="del('incomes','${x.id}')">×</button></div>`).join('')}</div><div class=card><div class=title>🛟 Финансовая подушка</div><div class=big>${money(db.cushion)}</div><div class=actions><input id=cush type=number placeholder="Пополнение"><button onclick="addCushion()">Добавить</button></div></div><div class=card><div class=title>💎 Личные сбережения</div><div class=big>${money(total(db.savings))}</div>${db.savings.map(x=>`<div class=row><div><b>${money(x.amount)} · ${esc(x.goal)}</b><span>${fmt(x.date)}</span></div><button class="small danger" onclick="del('savings','${x.id}')">×</button></div>`).join('')}<button onclick="savingForm()">➕ Добавить</button></div><div class=card><div class=title>💳 Счета</div>${db.accounts.map(x=>`<div class=row><span>${esc(x.name)}</span><b>${money(x.balance)}</b></div>`).join('')}<button class=secondary onclick="addAccount()">Добавить счёт</button></div><div class=card><button class=secondary onclick="changePin()">🔑 Изменить PIN</button></div>`}function more(){return `<div class=card><div class=title>🤝 Денежные обязательства</div><div class=muted>Люди, которым вы дали деньги. Возврат учитывается отдельно.</div><button style="margin-top:10px" onclick="debtForm()">➕ Выдать деньги в долг</button>${db.debts.map(x=>{let l=Math.max(0,Number(x.amount)-Number(x.returned||0));return `<div class=row><div class=row-main><b>${esc(x.person)} · ${money(l)}</b><span>Выдано ${money(x.amount)} · возвращено ${money(x.returned||0)} · срок ${x.due?fmt(x.due):'—'}</span></div><div class=actions><button class=small onclick="returnDebt('${x.id}')">Возврат</button><button class="small danger" onclick="del('debts','${x.id}')">×</button></div></div>`}).join('')||'<div class=empty>Нет выданных денег.</div>'}</div><div class=card><div class=title>❤️ Благотворительность</div><button onclick="charityForm()">➕ Добавить</button>${db.charity.map(x=>`<div class=row><div><b>${money(x.amount)} · ${esc(x.recipient)}</b><span>${fmt(x.date)} · ${esc(x.purpose||'')}</span></div><button class="small danger" onclick="del('charity','${x.id}')">×</button></div>`).join('')||'<div class=empty>Нет записей.</div>'}</div><div class=card><div class=title>⚙️ Настройки</div><button class=secondary onclick="addCategory()">Добавить категорию</button></div>`}function modal(t,b){document.getElementById('sheet').innerHTML=`<div class=title>${t}</div>${b}<div style="margin-top:15px"><button class=secondary onclick="closeModal()">Отмена</button></div>`;document.getElementById('modal').classList.remove('hidden')}function closeModal(){document.getElementById('modal').classList.add('hidden')}function expenseForm(id=''){let x=id?db.expenses.find(a=>a.id===id):{};modal(id?'Редактировать расход':'Новый расход',`<label>Дата</label><input id=fdate type=date value="${x.date||new Date().toISOString().slice(0,10)}"><label>Категория</label><select id=fcat>${db.categories.map(c=>`<option ${c===x.cat?'selected':''}>${esc(c)}</option>`).join('')}</select><label>Что именно</label><input id=fwhat value="${esc(x.what||'')}"><label>Магазин / место</label><input id=fplace value="${esc(x.place||'')}"><label>Сумма</label><input id=famount type=number value="${x.amount||''}"><label>Способ оплаты</label><select id=fpay><option>Карта</option><option>Наличные</option><option>Перевод</option><option>Другое</option></select><button style="margin-top:15px" onclick="saveExpense('${id}')">Сохранить</button>`)}function saveExpense(id){let x={id:id||uid(),date:fdate.value,cat:fcat.value,what:fwhat.value,place:fplace.value,amount:Number(famount.value),pay:fpay.value};if(!x.amount)return alert('Введите сумму');if(id)db.expenses=db.expenses.map(a=>a.id===id?x:a);else db.expenses.push(x);save();closeModal();show('expenses')}function incomeForm(){modal('Новый доход',`<label>Дата</label><input id=idate type=date value="${new Date().toISOString().slice(0,10)}"><label>Источник</label><input id=isource placeholder="Зарплата, подработка..."><label>Сумма</label><input id=iamount type=number><button style="margin-top:15px" onclick="saveIncome()">Сохранить</button>`)}function saveIncome(){if(!Number(iamount.value))return alert('Введите сумму');db.incomes.push({id:uid(),date:idate.value,source:isource.value,amount:Number(iamount.value)});save();closeModal();financeLock()}function savingForm(){modal('Личное сбережение',`<label>Дата</label><input id=sdate type=date value="${new Date().toISOString().slice(0,10)}"><label>Цель</label><input id=goal placeholder="На что копим"><label>Сумма</label><input id=samount type=number><button style="margin-top:15px" onclick="saveSaving()">Сохранить</button>`)}function saveSaving(){if(!Number(samount.value))return alert('Введите сумму');db.savings.push({id:uid(),date:sdate.value,goal:goal.value,amount:Number(samount.value)});save();closeModal();financeLock()}function debtForm(){modal('Выдать деньги в долг',`<label>Человек</label><input id=dperson><label>Дата</label><input id=ddate type=date value="${new Date().toISOString().slice(0,10)}"><label>Сумма</label><input id=damount type=number><label>Срок возврата</label><input id=ddue type=date><button style="margin-top:15px" onclick="saveDebt()">Сохранить</button>`)}function saveDebt(){if(!dperson.value||!Number(damount.value))return alert('Заполните данные');db.debts.push({id:uid(),person:dperson.value,date:ddate.value,amount:Number(damount.value),returned:0,due:ddue.value});save();closeModal();show('more')}function returnDebt(id){let x=db.debts.find(a=>a.id===id),l=Number(x.amount)-Number(x.returned||0),n=Number(prompt(`Сколько вернул ${x.person}? Остаток ${money(l)}`));if(!n||n<0||n>l)return;x.returned=(x.returned||0)+n;save();show('more')}function charityForm(){modal('Благотворительность',`<label>Дата</label><input id=cdate type=date value="${new Date().toISOString().slice(0,10)}"><label>Получатель</label><input id=crec><label>Сумма</label><input id=camount type=number><label>Назначение</label><input id=cpurpose><button style="margin-top:15px" onclick="saveCharity()">Сохранить</button>`)}function saveCharity(){if(!Number(camount.value))return alert('Введите сумму');db.charity.push({id:uid(),date:cdate.value,recipient:crec.value,amount:Number(camount.value),purpose:cpurpose.value});save();closeModal();show('more')}function addCushion(){let n=Number(cush.value);if(!n)return;db.cushion+=n;save();financeLock()}function changePin(){let p=prompt('Новый PIN, минимум 4 цифры');if(p&&/^\d{4,}$/.test(p)){db.pin=p;save();alert('PIN изменён')}}function addCategory(){let n=prompt('Название категории');if(n&&!db.categories.includes(n)){db.categories.push(n);save();show('more')}}function addAccount(){let n=prompt('Название счёта или карты');if(n){db.accounts.push({name:n,balance:0});save();financeLock()}}function del(t,id){if(confirm('Удалить запись?')){db[t]=db[t].filter(x=>x.id!==id);save();t==='expenses'?show('expenses'):t==='incomes'||t==='savings'?financeLock():show('more')}}function backup(){let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='FinControl-backup.json';a.click();URL.revokeObjectURL(u)}function restore(){let i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();alert('Данные восстановлены');show('home')}catch(e){alert('Файл не распознан')}};r.readAsText(i.files[0])};i.click()}show('home');</script></body></html>
