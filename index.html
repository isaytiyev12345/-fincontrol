<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="FinControl">
<title>FinControl 2.0</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;background:#f4f5f7;color:#111827}header{padding:20px 18px 12px;background:#111827;color:white;position:sticky;top:0;z-index:5}h1{margin:0;font-size:25px}.period{font-size:12px;color:#cbd5e1;margin-top:4px}main{max-width:820px;margin:auto;padding:14px 14px 100px}.card{background:white;border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 2px 12px #00000010}.title{font-size:18px;font-weight:800;margin-bottom:10px}.muted{font-size:12px;color:#64748b}.big{font-size:30px;font-weight:850}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#f8fafc;border-radius:15px;padding:13px}.metric b{display:block;font-size:19px;margin-top:5px}.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:12px;padding:11px 13px;background:#111827;color:#fff;font-weight:700}button.secondary{background:#e5e7eb;color:#111827}button.danger{background:#fee2e2;color:#991b1b}button.small{padding:7px 9px;font-size:12px}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e7eb;display:flex;justify-content:space-around;padding:7px 3px calc(7px + env(safe-area-inset-bottom));z-index:10}nav button{background:transparent;color:#64748b;font-size:10px;padding:5px}.active{color:#111827!important}input,select,textarea{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:11px;background:white;font-size:16px}textarea{min-height:70px}label{font-size:12px;color:#475569;display:block;margin:10px 0 5px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #eef2f7}.row:last-child{border-bottom:0}.row-main{min-width:0}.row-main b{display:block}.row-main span{font-size:12px;color:#64748b}.bar{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:#111827}.empty{text-align:center;padding:22px;color:#64748b}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;z-index:30}.sheet{background:#fff;width:100%;max-height:94vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px}.hidden{display:none!important}.tag{display:inline-block;background:#eef2ff;border-radius:99px;padding:5px 9px;font-size:11px}.warn{background:#fff7ed;color:#9a3412;border-radius:12px;padding:10px;font-size:12px}.good{background:#f0fdf4;color:#166534;border-radius:12px;padding:10px;font-size:12px}.search{margin-bottom:8px}.tablehead{display:flex;gap:8px;align-items:center;margin-bottom:8px}.selectlike{width:auto}.goal{background:#f8fafc;border-radius:14px;padding:12px;margin:8px 0}.right{text-align:right}.dangerText{color:#b91c1c}.positive{color:#166534}.branch{margin-top:8px;padding-left:10px;border-left:3px solid #cbd5e1}.branchrow{display:flex;justify-content:space-between;gap:8px;padding:5px 0;font-size:12px}.notice{background:#eef2ff;border-radius:12px;padding:10px;font-size:12px}.finance .card{padding:13px}.finance .title{font-size:15px}.finance .big{font-size:24px}.finance .row{font-size:13px}.finance .row span{font-size:11px}.finance button{font-size:13px;padding:9px 11px}.settings-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #eef2f7}.switch{width:48px;height:28px;border-radius:99px;background:#cbd5e1;position:relative;cursor:pointer}.switch i{position:absolute;width:22px;height:22px;border-radius:50%;background:white;top:3px;left:3px;transition:.2s}.switch.on{background:#111827}.switch.on i{left:23px}.dark body{}body.dark{background:#0b1220;color:#e5e7eb}body.dark header{background:#020617}body.dark .card,body.dark .sheet,body.dark nav{background:#111827;color:#e5e7eb}body.dark .metric,body.dark .goal{background:#1f2937}body.dark input,body.dark select,body.dark textarea{background:#0f172a;color:#e5e7eb;border-color:#334155}body.dark .muted,body.dark .row-main span{color:#94a3b8}body.dark .bar{background:#334155}body.dark button.secondary{background:#334155;color:#e5e7eb}.lockscreen{position:fixed;inset:0;background:#0b1220;color:white;display:flex;align-items:center;justify-content:center;padding:24px;z-index:100}.lockbox{width:100%;max-width:360px;text-align:center}.lockbox h2{font-size:28px;margin:0 0 8px}.lockbox p{color:#94a3b8}.lockbox input{text-align:center;font-size:24px;letter-spacing:8px;background:#111827;color:white;border-color:#334155}.lockbox button{width:100%;margin-top:12px}
</style></head><body>
<header><h1>FinControl</h1><div class="period" id="period"></div></header><main id="app"></main>
<nav><button id="n-home" onclick="show('home')">🏠<br>Главная</button><button id="n-expenses" onclick="show('expenses')">💸<br>Расходы</button><button id="n-analysis" onclick="show('analysis')">📊<br>Аналитика</button><button id="n-finance" onclick="financeLock()">🔐<br>Финансы</button><button id="n-more" onclick="show('more')">⚙️<br>Ещё</button></nav>
<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
<script>
const OLD='fincontrol_v1_0',KEY='fincontrol_v2_0';
const defaults={expenses:[],incomes:[],allocations:[],allocationCategories:[{id:'cushion',name:'Финансовая подушка',icon:'🛟'},{id:'savings',name:'Сбережения',icon:'💎'}],debts:[],charity:[],savings:[],cushion:0,accounts:[{id:'cash',name:'Наличные',balance:0},{id:'main',name:'Основная карта',balance:0},{id:'other',name:'Другая карта',balance:0},{id:'save',name:'Накопительный счёт',balance:0}],categories:['Продукты','Автомобиль','Дом','Лечение','Одежда','Развлечения','Кафе/рестораны','Услуги','Транспорт','Связь/интернет','Покупки','Обучение','Другое'],budgets:{},pin:'1234',financePinEnabled:true,appPin:'',appLock:false,theme:'light',currency:'RUB'};
let db=JSON.parse(localStorage.getItem(KEY)||'null');
if(!db){let old=JSON.parse(localStorage.getItem(OLD)||'null');db=old?migrate(old):structuredClone(defaults);save()}
function migrate(o){return {...structuredClone(defaults),...o,allocations:o.allocations||[],allocationCategories:o.allocationCategories||structuredClone(defaults.allocationCategories),budgets:o.budgets||{},financePinEnabled:o.financePinEnabled!==false,appPin:o.appPin||'',appLock:!!o.appLock,theme:o.theme||'light'}}
function applyTheme(){document.body.classList.toggle('dark',db.theme==='dark')}
function appLocked(){return db.appLock&&db.appPin}
function showLock(){if(!appLocked())return;let el=document.createElement('div');el.className='lockscreen';el.id='lockscreen';el.innerHTML='<div class=lockbox><div style=font-size:54px>🔐</div><h2>FinControl</h2><p>Введите пароль для входа</p><input id=appPass type=password inputmode=numeric maxlength=12 placeholder=••••><button onclick=unlockApp()>Войти</button><div id=lockErr style=margin-top:10px;color:#fca5a5;font-size:12px></div></div>';document.body.appendChild(el);setTimeout(()=>document.getElementById('appPass')?.focus(),100)}
function unlockApp(){let v=document.getElementById('appPass')?.value;if(v===db.appPin){document.getElementById('lockscreen')?.remove()}else document.getElementById('lockErr').textContent='Неверный пароль'}
function lockApp(){if(appLocked()){showLock()}}
applyTheme()
function save(){localStorage.setItem(KEY,JSON.stringify(db))}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function money(n){return new Intl.NumberFormat('ru-RU',{style:'currency',currency:db.currency||'RUB',maximumFractionDigits:0}).format(Number(n)||0)}
function fmt(s){if(!s)return'—';let d=new Date(s);return isNaN(d)?'—':d.toLocaleDateString('ru-RU')}
function iso(d=new Date()){let x=new Date(d);return new Date(x.getTime()-x.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function periodFor(base=new Date()){let y=base.getFullYear(),m=base.getMonth();if(base.getDate()<15)m--;return{start:new Date(y,m,15),end:new Date(y,m+1,14,23,59,59)}}
function currentPeriod(){return periodFor(new Date())}function inPeriod(s,p=currentPeriod()){let d=new Date(s);return d>=p.start&&d<=p.end}
function label(p=currentPeriod()){return fmt(p.start)+' → '+fmt(p.end)}function total(a){return a.reduce((s,x)=>s+Number(x.amount||0),0)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function nav(id){document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));document.getElementById('n-'+id)?.classList.add('active')}
function show(id){nav(id);document.getElementById('period').textContent='Финансовый период: '+label();document.getElementById('app').innerHTML=id==='home'?home():id==='expenses'?expenses():id==='analysis'?analysis():more()}
function cashFlow(p=currentPeriod()){let I=total(db.incomes.filter(x=>inPeriod(x.date,p))),E=total(db.expenses.filter(x=>inPeriod(x.date,p))),A=total(db.allocations.filter(x=>inPeriod(x.date,p))),S=total(db.savings.filter(x=>inPeriod(x.date,p))),C=total(db.charity.filter(x=>inPeriod(x.date,p))),L=total(db.debts.filter(x=>inPeriod(x.date,p))),R=total(db.debts.flatMap(x=>x.returns||[]).filter(x=>inPeriod(x.date,p)));return{I,E,A,S,C,L,R,left:I-E-A-S-C-L+R}}
function home(){let f=cashFlow(),e=db.expenses.filter(x=>inPeriod(x.date)),days=Math.max(1,Math.ceil((new Date()-currentPeriod().start)/86400000)+1),daily=f.E/days;return `<div class=card><div class=muted>СВОБОДНЫЙ ОСТАТОК ЗА ПЕРИОД</div><div class=big>${money(f.left)}</div><div class=muted>Средний расход: ${money(daily)} в день</div><div class=actions style="margin-top:12px"><button onclick="expenseForm()">➕ Расход</button><button onclick="incomeForm()">➕ Доход</button><button onclick="savingForm()">💎 Накопить</button><button onclick="debtForm()">🤝 Дать в долг</button></div></div><div class=grid><div class=metric>Доходы<b>${money(f.I)}</b></div><div class=metric>Расходы<b>${money(f.E)}</b></div><div class=metric>Благотворительность<b>${money(f.C)}</b></div><div class=metric>Остаток<b>${money(f.left)}</b></div></div><div class=card><div class=title>Бюджет периода</div>${budgetSummary(e)}</div><div class=card><div class=title>Расходы по категориям</div>${categoryRows(e)}</div>`}
function budgetSummary(e){let rows=db.categories.map(c=>{let spent=total(e.filter(x=>x.cat===c)),lim=Number(db.budgets[c]||0);return lim?{c,spent,lim}:null}).filter(Boolean);if(!rows.length)return '<div class=muted>Лимиты пока не заданы. Задай их в разделе «Ещё → Бюджеты».</div>';return rows.map(x=>{let pct=Math.min(100,Math.round(x.spent/x.lim*100));return `<div class=row><div style="flex:1"><b>${esc(x.c)}</b><div class=bar><i style="width:${pct}%"></i></div><span>${money(x.spent)} / ${money(x.lim)}</span></div><b class=${x.spent>x.lim?'dangerText':'positive'}>${x.spent>x.lim?'+'+money(x.spent-x.lim):'осталось '+money(x.lim-x.spent)}</b></div>`}).join('')}
function categoryRows(e){let rows=db.categories.map(c=>({c,v:total(e.filter(x=>x.cat===c))})).filter(x=>x.v).sort((a,b)=>b.v-a.v);return rows.map(x=>`<div class=row><span>${esc(x.c)}</span><b>${money(x.v)}</b></div>`).join('')||'<div class=empty>Пока нет расходов.</div>'}
function expenses(){let a=[...db.expenses].sort((x,y)=>y.date.localeCompare(x.date));return `<div class=card><div class=actions><button onclick="expenseForm()">➕ Добавить расход</button><button class=secondary onclick="backup()">💾 Резервная копия</button><button class=secondary onclick="restore()">↩️ Восстановить</button></div><label>Поиск</label><input class=search id=esearch placeholder="магазин, категория, покупка..." oninput="renderExpenseList()"></div><div class=card id=expenseList>${expenseList(a)}</div>`}
function expenseList(a){return a.map(x=>`<div class=row><div class=row-main><b>${money(x.amount)} · ${esc(x.cat)}</b><span>${fmt(x.date)} · ${esc(x.place||'')} · ${esc(x.what||'')} · ${esc(x.pay||'')}</span></div><div class=actions><button class=small onclick="expenseForm('${x.id}')">Изм.</button><button class="small danger" onclick="del('expenses','${x.id}','expenses')">×</button></div></div>`).join('')||'<div class=empty>Нет записей.</div>'}
function renderExpenseList(){let q=(document.getElementById('esearch')?.value||'').toLowerCase();let a=db.expenses.filter(x=>[x.cat,x.place,x.what,x.pay].join(' ').toLowerCase().includes(q)).sort((x,y)=>y.date.localeCompare(x.date));document.getElementById('expenseList').innerHTML=expenseList(a)}
function analysis(){let p=selectedAnalysisPeriod||currentPeriod(),f=cashFlow(p),e=db.expenses.filter(x=>inPeriod(x.date,p)),cats=db.categories.map(c=>({c,v:total(e.filter(x=>x.cat===c))})).filter(x=>x.v).sort((a,b)=>b.v-a.v);return `<div class=card><div class=title>📊 Аналитика</div><label>Период для просмотра</label><select onchange="selectAnalysis(this.value)">${periodOptions(p)}</select><div class=grid style="margin-top:10px"><div class=metric>Доход<b>${money(f.I)}</b></div><div class=metric>Распределено<b>${money(f.A)}</b></div><div class=metric>Расходы<b>${money(f.E)}</b></div><div class=metric>Остаток<b>${money(f.left)}</b></div></div><div class=notice style="margin-top:10px">${label(p)} · В долг: ${money(f.L)} · Возвращено: ${money(f.R)}</div></div><div class=card><div class=title>Распределение доходов</div>${allocationSummary(p)}</div><div class=card><div class=title>Категории расходов</div>${cats.map(x=>`<div class=row><div style="flex:1"><b>${esc(x.c)}</b><div class=bar><i style="width:${f.E?Math.round(x.v/f.E*100):0}%"></i></div></div><b>${money(x.v)}</b></div>`).join('')||'<div class=empty>Нет данных.</div>'}</div><div class=card><div class=title>История периодов</div>${historyRows()}</div>`}
function periodKey(p){return iso(p.start)}
function periodOptions(selected){let out='';for(let k=0;k<18;k++){let d=new Date();d.setDate(15);d.setMonth(d.getMonth()-k);let p=periodFor(d);out+=`<option value="${periodKey(p)}" ${periodKey(p)===periodKey(selected)?'selected':''}>${label(p)}</option>`}return out}
function periodByKey(k){let d=new Date(k+'T12:00:00');return periodFor(d)}
let selectedAnalysisPeriod=null;
function selectAnalysis(k){selectedAnalysisPeriod=periodByKey(k);show('analysis')}
function historyRows(){let periods=[];for(let k=0;k<12;k++){let d=new Date();d.setDate(15);d.setMonth(d.getMonth()-k);let p=periodFor(d),f=cashFlow(p);periods.push({p,f})}return periods.map(x=>`<div class=row><div><b>${label(x.p)}</b><span>Доход ${money(x.f.I)} · Распределено ${money(x.f.A)} · Расход ${money(x.f.E)}</span></div><b class=${x.f.left<0?'dangerText':'positive'}>${money(x.f.left)}</b></div>`).join('')}
function allocationName(id){let x=db.allocationCategories.find(a=>a.id===id);return x?x.icon+' '+x.name:'Статья'}
function allocationSummary(p=currentPeriod()){let rows=db.allocationCategories.map(c=>{let v=total(db.allocations.filter(a=>a.categoryId===c.id&&inPeriod(a.date,p)));return {...c,v}}).filter(x=>x.v);return rows.map(x=>`<div class=row><span>${esc(x.icon+' '+x.name)}</span><b>${money(x.v)}</b></div>`).join('')||'<div class=empty>Пока нет распределений.</div>'}
function financeLock(){if(db.financePinEnabled!==false){let p=prompt('PIN раздела «Финансы»');if(p!==db.pin)return alert('Неверный PIN')}nav('finance');document.getElementById('period').textContent='Финансовый период: '+label();document.getElementById('app').innerHTML=finance()}
function finance(){let p=currentPeriod(),I=total(db.incomes.filter(x=>inPeriod(x.date,p))),A=total(db.allocations.filter(x=>inPeriod(x.date,p))),S=total(db.savings.filter(x=>inPeriod(x.date,p))),bal=db.accounts.reduce((s,x)=>s+Number(x.balance||0),0);return `<div class=finance><div class=card><div class=title>💰 Доходы и распределение</div><div class=big>${money(I)}</div><div class=muted>Распределено: ${money(A)} · Осталось от доходов: ${money(I-A)}</div><button onclick="incomeForm()">➕ Добавить доход</button>${db.incomes.sort((a,b)=>b.date.localeCompare(a.date)).map(x=>{let parts=db.allocations.filter(a=>a.incomeId===x.id);let used=total(parts);return `<div class=row style="align-items:flex-start"><div style="flex:1"><b>${money(x.amount)} · ${esc(x.source)}</b><span>${fmt(x.date)} · ${esc(x.note||'')}</span>${parts.length?`<div class=branch>${parts.map(a=>`<div class=branchrow><span>${esc(allocationName(a.categoryId))}</span><b>${money(a.amount)}</b></div>`).join('')}</div>`:'<div class=muted style="margin-top:5px">Пока не распределено: ${money(Number(x.amount)-used)}</div>'}</div><div class=actions><button class=small onclick="allocationForm('${x.id}')">↗ Распределить</button><button class=small onclick="incomeForm('${x.id}')">Изм.</button><button class="small danger" onclick="del('incomes','${x.id}','finance')">×</button></div></div>`}).join('')||'<div class=empty>Нет доходов.</div>'}</div><div class=card><div class=title>🧩 Статьи распределения</div><div class=muted>Сюда можно добавлять финансовую подушку, сбережения и любые другие цели.</div>${allocationSummary(p)}<button class=secondary onclick="addAllocationCategory()">➕ Добавить статью</button></div><div class=card><div class=title>🛟 Финансовая подушка</div><div class=big>${money(total(db.allocations.filter(a=>a.categoryId==='cushion'))+Number(db.cushion||0))}</div><div class=muted>Пополнение создаётся как распределение конкретного дохода и вычитается из его остатка.</div><button onclick="cushionForm()">➕ Распределить в подушку</button></div><div class=card><div class=title>💎 Старые личные сбережения</div><div class=big>${money(S)}</div><button onclick="savingForm()">➕ Добавить</button>${db.savings.sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class=row><div><b>${money(x.amount)} · ${esc(x.goal||'Без цели')}</b><span>${fmt(x.date)}</span></div><div class=actions><button class=small onclick="savingForm('${x.id}')">Изм.</button><button class="small danger" onclick="del('savings','${x.id}','finance')">×</button></div></div>`).join('')||'<div class=empty>Нет накоплений.</div>'}</div><div class=card><div class=title>💳 Счета и карты</div><div class=big>${money(bal)}</div>${db.accounts.map(x=>`<div class=row><div><b>${esc(x.name)}</b><span>Баланс</span></div><div class=actions><b>${money(x.balance)}</b><button class=small onclick="accountForm('${x.id}')">Изм.</button></div></div>`).join('')}<button class=secondary onclick="accountForm()">➕ Добавить счёт</button></div><div class=card><div class=title>🔐 Защита раздела «Финансы»</div><div class=muted>Состояние: ${db.financePinEnabled!==false?'PIN включён':'PIN отключён'}</div><button class=secondary onclick="toggleFinancePin()">${db.financePinEnabled!==false?'🔓 Отключить PIN для финансов':'🔒 Включить PIN для финансов'}</button><button class=secondary onclick="changePin()" style="margin-left:6px">🔑 Изменить PIN</button><button class=secondary onclick="backup()" style="margin-left:6px">💾 Резервная копия</button></div></div>`}
function more(){return `<div class=card><div class=title>🤝 Денежные обязательства — «Мне должны»</div><button onclick="debtForm()">➕ Выдать деньги</button>${db.debts.map(x=>{let l=Math.max(0,Number(x.amount)-Number(x.returned||0));return `<div class=row><div class=row-main><b>${esc(x.person)} · ${money(l)}</b><span>Выдано ${money(x.amount)} · возвращено ${money(x.returned||0)} · срок ${x.due?fmt(x.due):'—'}</span></div><div class=actions><button class=small onclick="returnDebt('${x.id}')">Возврат</button><button class=small onclick="debtForm('${x.id}')">Изм.</button><button class="small danger" onclick="del('debts','${x.id}','more')">×</button></div></div>`}).join('')||'<div class=empty>Нет выданных денег.</div>'}</div><div class=card><div class=title>❤️ Благотворительность</div><button onclick="charityForm()">➕ Добавить</button>${db.charity.map(x=>`<div class=row><div><b>${money(x.amount)} · ${esc(x.recipient)}</b><span>${fmt(x.date)} · ${esc(x.purpose||'')}</span></div><div class=actions><button class=small onclick="charityForm('${x.id}')">Изм.</button><button class="small danger" onclick="del('charity','${x.id}','more')">×</button></div></div>`).join('')||'<div class=empty>Нет записей.</div>'}</div><div class=card><div class=title>🎯 Бюджеты</div><div class=muted>Лимиты на один финансовый период.</div>${db.categories.map(c=>`<div class=row><span>${esc(c)}</span><input style="max-width:145px" type=number value="${db.budgets[c]||''}" placeholder="без лимита" onchange="setBudget('${esc(c)}',this.value)"></div>`).join('')}</div><div class=card><div class=title>⚙️ Настройки приложения</div><div class=settings-row><div><b>🔐 Пароль при входе</b><div class=muted>${db.appLock?'Включён':'Выключен'}</div></div><div class="switch ${db.appLock?'on':''}" onclick="toggleAppLock()"><i></i></div></div><button class=secondary onclick="setAppPin()">🔑 ${db.appPin?'Изменить пароль входа':'Установить пароль входа'}</button><div class=settings-row><div><b>🌙 Тёмный интерфейс</b><div class=muted>${db.theme==='dark'?'Включён':'Выключен'}</div></div><div class="switch ${db.theme==='dark'?'on':''}" onclick="toggleTheme()"><i></i></div></div><button class=secondary onclick="lockApp()">🔒 Заблокировать сейчас</button><button class=secondary onclick="addCategory()">➕ Добавить категорию</button><button class=secondary onclick="resetData()" style="margin-left:6px">Сбросить данные</button></div>`}
function modal(t,b){document.getElementById('sheet').innerHTML=`<div class=title>${t}</div>${b}<div style="margin-top:15px"><button class=secondary onclick="closeModal()">Отмена</button></div>`;document.getElementById('modal').classList.remove('hidden')}function closeModal(){document.getElementById('modal').classList.add('hidden')}
function expenseForm(id=''){let x=id?db.expenses.find(a=>a.id===id):{};modal(id?'Редактировать расход':'Новый расход',`<label>Дата</label><input id=fdate type=date value="${x.date||iso()}"><label>Категория</label><select id=fcat>${db.categories.map(c=>`<option ${c===x.cat?'selected':''}>${esc(c)}</option>`).join('')}</select><label>Что именно</label><input id=fwhat value="${esc(x.what||'')}" placeholder="Например: продукты на неделю"><label>Магазин / место</label><input id=fplace value="${esc(x.place||'')}"><label>Сумма</label><input id=famount type=number value="${x.amount||''}"><label>Способ оплаты</label><select id=fpay><option ${x.pay==='Карта'?'selected':''}>Карта</option><option ${x.pay==='Наличные'?'selected':''}>Наличные</option><option ${x.pay==='Перевод'?'selected':''}>Перевод</option><option ${x.pay==='Другое'?'selected':''}>Другое</option></select><label>Комментарий</label><textarea id=fnote>${esc(x.note||'')}</textarea><button style="margin-top:15px" onclick="saveExpense('${id}')">Сохранить</button>`)}
function saveExpense(id){let x={id:id||uid(),date:fdate.value,cat:fcat.value,what:fwhat.value,place:fplace.value,amount:Number(famount.value),pay:fpay.value,note:fnote.value};if(!x.amount)return alert('Введите сумму');if(id)db.expenses=db.expenses.map(a=>a.id===id?x:a);else db.expenses.push(x);save();closeModal();show('expenses')}
function incomeForm(id=''){let x=id?db.incomes.find(a=>a.id===id):{};modal(id?'Редактировать доход':'Новый доход',`<label>Дата</label><input id=idate type=date value="${x.date||iso()}"><label>Источник</label><input id=isource value="${esc(x.source||'')}" placeholder="Зарплата, подработка..."><label>Сумма</label><input id=iamount type=number value="${x.amount||''}"><label>Комментарий</label><input id=inote value="${esc(x.note||'')}"><button style="margin-top:15px" onclick="saveIncome('${id}')">Сохранить</button>`)}
function saveIncome(id){if(!Number(iamount.value))return alert('Введите сумму');let x={id:id||uid(),date:idate.value,source:isource.value,amount:Number(iamount.value),note:inote.value};if(id)db.incomes=db.incomes.map(a=>a.id===id?x:a);else db.incomes.push(x);save();closeModal();financeLock()}
function allocationForm(incomeId){let income=db.incomes.find(x=>x.id===incomeId);if(!income)return;let used=total(db.allocations.filter(a=>a.incomeId===incomeId));let remaining=Number(income.amount)-used;modal('Распределить доход',`<div class=good>Доход: <b>${money(income.amount)}</b><br>Уже распределено: <b>${money(used)}</b><br>Остаток для распределения: <b>${money(remaining)}</b></div><label>Статья</label><select id=acat>${db.allocationCategories.map(c=>`<option value="${c.id}">${esc(c.icon+' '+c.name)}</option>`).join('')}</select><label>Сумма</label><input id=aamount type=number min=1 max="${remaining}" placeholder="Например, 10000"><label>Дата</label><input id=adate type=date value="${income.date||iso()}"><button style="margin-top:15px" onclick="saveAllocation('${incomeId}')">Распределить сумму</button><div class=muted style="margin-top:8px">Каждое распределение уменьшает доступный остаток дохода на главном экране.</div>`)}
function saveAllocation(incomeId){let income=db.incomes.find(x=>x.id===incomeId),amount=Number(aamount.value),used=total(db.allocations.filter(a=>a.incomeId===incomeId));if(!amount||amount>Number(income.amount)-used)return alert('Сумма превышает остаток дохода');db.allocations.push({id:uid(),incomeId,categoryId:acat.value,amount,date:adate.value});save();closeModal();financeLock()}
function addAllocationCategory(){let name=prompt('Название новой статьи (например: отпуск, инвестиции, вклад)');if(!name)return;db.allocationCategories.push({id:uid(),name:name.trim(),icon:'📌'});save();financeLock()}
function savingForm(id=''){let x=id?db.savings.find(a=>a.id===id):{};modal(id?'Редактировать накопление':'Личное сбережение',`<label>Дата</label><input id=sdate type=date value="${x.date||iso()}"><label>Цель</label><input id=goal value="${esc(x.goal||'')}" placeholder="На что копим"><label>Сумма</label><input id=samount type=number value="${x.amount||''}"><button style="margin-top:15px" onclick="saveSaving('${id}')">Сохранить</button>`)}
function saveSaving(id){if(!Number(samount.value))return alert('Введите сумму');let x={id:id||uid(),date:sdate.value,goal:goal.value,amount:Number(samount.value)};if(id)db.savings=db.savings.map(a=>a.id===id?x:a);else db.savings.push(x);save();closeModal();financeLock()}
function debtForm(id=''){let x=id?db.debts.find(a=>a.id===id):{};modal(id?'Редактировать обязательство':'Выдать деньги в долг',`<label>Человек</label><input id=dperson value="${esc(x.person||'')}"><label>Дата</label><input id=ddate type=date value="${x.date||iso()}"><label>Сумма</label><input id=damount type=number value="${x.amount||''}"><label>Срок возврата</label><input id=ddue type=date value="${x.due||''}"><button style="margin-top:15px" onclick="saveDebt('${id}')">Сохранить</button>`)}
function saveDebt(id){if(!dperson.value||!Number(damount.value))return alert('Заполните данные');let old=id?db.debts.find(x=>x.id===id):null,x={id:id||uid(),person:dperson.value,date:ddate.value,amount:Number(damount.value),returned:old?.returned||0,due:ddue.value,returns:old?.returns||[]};if(id)db.debts=db.debts.map(a=>a.id===id?x:a);else db.debts.push(x);save();closeModal();show('more')}
function returnDebt(id){let x=db.debts.find(a=>a.id===id),l=Number(x.amount)-Number(x.returned||0),n=Number(prompt(`Сколько вернул ${x.person}? Остаток ${money(l)}`));if(!n||n<0||n>l)return;x.returned=(x.returned||0)+n;(x.returns||=[]).push({date:iso(),amount:n});save();show('more')}
function charityForm(id=''){let x=id?db.charity.find(a=>a.id===id):{};modal(id?'Редактировать благотворительность':'Благотворительность',`<label>Дата</label><input id=cdate type=date value="${x.date||iso()}"><label>Получатель</label><input id=crec value="${esc(x.recipient||'')}"><label>Сумма</label><input id=camount type=number value="${x.amount||''}"><label>Назначение</label><input id=cpurpose value="${esc(x.purpose||'')}"><button style="margin-top:15px" onclick="saveCharity('${id}')">Сохранить</button>`)}
function saveCharity(id){if(!Number(camount.value))return alert('Введите сумму');let x={id:id||uid(),date:cdate.value,recipient:crec.value,amount:Number(camount.value),purpose:cpurpose.value};if(id)db.charity=db.charity.map(a=>a.id===id?x:a);else db.charity.push(x);save();closeModal();show('more')}
function accountForm(id=''){let x=id?db.accounts.find(a=>a.id===id):{};modal(id?'Редактировать счёт':'Новый счёт',`<label>Название</label><input id=aname value="${esc(x.name||'')}"><label>Текущий баланс</label><input id=abalance type=number value="${x.balance||0}"><button style="margin-top:15px" onclick="saveAccount('${id}')">Сохранить</button>`)}
function saveAccount(id){if(!aname.value)return alert('Введите название');let x={id:id||uid(),name:aname.value,balance:Number(abalance.value||0)};if(id)db.accounts=db.accounts.map(a=>a.id===id?x:a);else db.accounts.push(x);save();closeModal();financeLock()}
function cushionForm(){let cats=db.incomes.filter(x=>Number(x.amount)>0);if(!cats.length)return alert('Сначала добавьте доход');modal('Распределить в финансовую подушку',`<label>Доход</label><select id=cinc>${cats.map(x=>`<option value="${x.id}">${fmt(x.date)} · ${esc(x.source||'Доход')} · ${money(x.amount)}</option>`).join('')}</select><label>Сумма</label><input id=camount type=number min=1 placeholder="Например, 10000"><label>Дата</label><input id=cdate2 type=date value="${iso()}"><button style="margin-top:15px" onclick="saveCushionAllocation()">Распределить</button><div class=muted style="margin-top:8px">Сумма будет вычтена из остатка выбранного дохода.</div>`)}
function saveCushionAllocation(){let income=db.incomes.find(x=>x.id===cinc.value),amount=Number(camount.value),used=total(db.allocations.filter(a=>a.incomeId===income.id));if(!income||!amount||amount>Number(income.amount)-used)return alert('Сумма превышает остаток выбранного дохода');db.allocations.push({id:uid(),incomeId:income.id,categoryId:'cushion',amount,date:cdate2.value});save();closeModal();financeLock()}
function addCushion(){return cushionForm()}
function toggleFinancePin(){if(db.financePinEnabled!==false){let p=prompt('Введите текущий PIN, чтобы отключить защиту');if(p!==db.pin)return alert('Неверный PIN');db.financePinEnabled=false}else{db.financePinEnabled=true}save();financeLock()}
function changePin(){let p=prompt('Новый PIN, минимум 4 цифры');if(p&&/^\d{4,}$/.test(p)){db.pin=p;save();alert('PIN изменён')}}
function setAppPin(){let p=prompt('Новый пароль входа — минимум 4 цифры');if(p&&/^\d{4,}$/.test(p)){db.appPin=p;db.appLock=true;save();alert('Пароль входа установлен');show('more')}}
function toggleAppLock(){if(db.appLock){db.appLock=false;save();show('more')}else{if(!db.appPin)return setAppPin();db.appLock=true;save();show('more')}}
function toggleTheme(){db.theme=db.theme==='dark'?'light':'dark';save();applyTheme();show('more')}
function addCategory(){let n=prompt('Название категории');if(n&&!db.categories.includes(n)){db.categories.push(n);save();show('more')}}
function setBudget(c,v){db.budgets[c]=Number(v)||0;save()}
function del(t,id,next){if(confirm('Удалить запись?')){db[t]=db[t].filter(x=>x.id!==id);save();next==='expenses'?show('expenses'):next==='finance'?financeLock():show('more')}}
function backup(){let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='FinControl-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}
function restore(){let i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.expenses||!x.incomes)throw 0;db=migrate(x);save();alert('Данные восстановлены');show('home')}catch(e){alert('Файл не распознан')}};r.readAsText(i.files[0])};i.click()}
function resetData(){if(confirm('Удалить все данные FinControl? Резервную копию лучше сделать заранее.')){db=structuredClone(defaults);save();show('home')}}
show('home');
if(appLocked())showLock();
</script>
<script>
/* FinControl 2.2: best-effort persistent storage + encrypted backup helpers */
(function(){
  const KEY='fc22_backup_meta';
  const enc=new TextEncoder(), dec=new TextDecoder();
  const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a)));
  const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  async function keyFrom(p,s){const b=await crypto.subtle.importKey('raw',enc.encode(p),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:150000,hash:'SHA-256'},b,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
  window.FC22Backup={async export(password){if(!password)throw Error('Нужен пароль');const raw=JSON.stringify(localStorage);const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const k=await keyFrom(password,salt);const data=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,enc.encode(raw));const name='FinControl_Backup_'+new Date().toISOString().slice(0,10)+'.fcbackup';const f=new File([JSON.stringify({v:1,salt:b64(salt),iv:b64(iv),data:b64(data)})],name,{type:'application/octet-stream'});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({title:'FinControl backup',files:[f]});else{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=name;a.click();}localStorage.setItem(KEY,JSON.stringify({name,date:new Date().toISOString(),size:f.size}));return name;},async import(file,password){const x=JSON.parse(await file.text()),k=await keyFrom(password,unb64(x.salt));const raw=dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(x.iv)},k,unb64(x.data)));JSON.parse(raw);const o=JSON.parse(raw);Object.keys(o).forEach(k=>localStorage.setItem(k,o[k]));location.reload();}};
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
})();
</script>
